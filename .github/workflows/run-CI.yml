name: CI Pipeline

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      browserName:
        description: 'Browseer Type'
        default: 'CHROME'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Clean Install Maven
        run: mvn clean install

      - name: Run tests
        run: mvn -DbrowserName=${{github.event.inputs.browserName || 'EDGE' }} test
